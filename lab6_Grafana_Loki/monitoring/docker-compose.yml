version: "3.7"

networks:
  loki:

services:
  # Loki: The log aggregation backend
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki
    volumes:
      # Use the local config file
      - ./loki-config.yaml:/etc/loki/local-config.yaml

  # Promtail: The log shipper that collects logs and sends them to Loki
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      # Mount the Promtail configuration created above
      - ./promtail-config.yml:/etc/promtail/config.yml
      # Mount the Docker socket and logs directory (CRITICAL for production)
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - loki
    # Running Promtail with these volume mounts requires appropriate permissions.
    
  # Grafana: The visualization layer for Loki data
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - loki
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
