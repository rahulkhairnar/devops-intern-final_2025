server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # Loki will run on the Docker internal network under the service name 'loki'
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: codespace-logs
          # Standard labels for all logs scraped by this Promtail instance
          __path__: /var/log/syslog # Placeholder log path

  - job_name: devops-hello-container
    static_configs:
      - targets:
          - localhost
        labels:
          job: devops-app
          environment: codespace
        # This configuration tells Promtail to look at Docker logs (though simplified here)
        # In a real setup, Promtail would connect to the Docker socket.
